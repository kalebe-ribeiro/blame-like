<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
  <title>CYBERCOSMIC</title>

  <!-- Import map: resolve "three" direto do node_modules, sem bundler. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/",
        "three-mesh-bvh": "./node_modules/three-mesh-bvh/build/index.module.js"
      }
    }
  </script>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="hud"></canvas>

  <!-- Tela de entrada: aparece no início e sempre que o ponteiro é liberado (ESC). -->
  <div id="gate">
    <div class="gate-title" data-i18n="gate.title"></div>
    <div class="gate-sub" data-i18n="gate.enter"></div>
    <div class="gate-keys" data-i18n-html="gate.keys"></div>
    <div class="gate-buttons">
      <button class="gate-settings" id="open-transport" data-i18n="gate.transport"></button>
      <button class="gate-settings" id="open-settings" data-i18n="gate.settings"></button>
      <button class="gate-settings" id="new-world" data-i18n="gate.newWorld"></button>
    </div>
    <div class="gate-diary" id="gate-diary"></div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
